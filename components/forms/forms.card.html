<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{background:var(--surface-card);padding:20px;margin:0}.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.lbl{font-family:var(--font-ui);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-faint);margin:0 0 8px}.grp{margin-bottom:16px}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.451.0/dist/umd/lucide.js"></script>
<script src="../../_ds_bundle.js"></script></head><body><div id="root"></div>
<script type="text/babel">
const { Input, Select, Textarea, Checkbox, Radio, RadioGroup, Switch } = window.JordonNunoLandscapingDesignSystem_ad8525;

function Demo(){const [freq,setFreq]=React.useState('biweekly');return (<div>
<div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16,marginBottom:16}}>
<Input label="Full name" required placeholder="Marla Tran"/>
<Input label="Property size" suffix={<span style={{fontFamily:'var(--font-mono)',fontSize:12}}>ac</span>} placeholder="0.42"/>
<Select label="Service" placeholder="Choose a service" options={['Mowing','Seasonal cleanup','Mulch install','Irrigation check']}/>
<Input label="Email" error="We need an email to send the quote." defaultValue="marla@"/>
</div>
<div style={{marginBottom:16}}><Textarea label="What do you need done?" rows={2} placeholder="Quarter acre, back gate is unlocked."/></div>
<div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16,alignItems:'start'}}>
<RadioGroup label="How often?">
<Radio name="f" value="weekly" label="Weekly" checked={freq==='weekly'} onChange={()=>setFreq('weekly')}/>
<Radio name="f" value="biweekly" label="Every other week" description="Most common" checked={freq==='biweekly'} onChange={()=>setFreq('biweekly')}/>
</RadioGroup>
<div style={{display:'flex',flexDirection:'column',gap:14}}>
<Checkbox label="Recurring visit" description="April through October" defaultChecked/>
<Checkbox label="Gate is locked"/>
<Switch label="Text me the day before" defaultChecked/>
</div></div></div>);}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script></body></html>
