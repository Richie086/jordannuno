<!-- @dsCard group="Colors" viewport="700x130" name="Status pairs" subtitle="Foreground on background for each semantic state." -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:var(--surface-card);padding:20px;font-family:var(--font-sans)}.sw{display:flex;gap:0}.sw div{flex:1;height:56px;display:flex;align-items:flex-end;padding:6px;font-family:var(--font-mono);font-size:10px}.lbl{font-family:var(--font-ui);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-faint);margin-bottom:8px}.chips{display:flex;gap:10px;flex-wrap:wrap}.chip{padding:8px 14px;border-radius:999px;font-family:var(--font-ui);font-size:13px;font-weight:600}</style></head><body><div class="lbl">status</div><div class="chips">
<span class="chip" style="background:var(--status-success-bg);color:var(--status-success-fg)">Completed</span>
<span class="chip" style="background:var(--status-warning-bg);color:var(--status-warning-fg)">Weather hold</span>
<span class="chip" style="background:var(--status-danger-bg);color:var(--status-danger-fg)">Overdue</span>
<span class="chip" style="background:var(--status-info-bg);color:var(--status-info-fg)">Scheduled</span>
<span class="chip" style="background:var(--status-neutral-bg);color:var(--status-neutral-fg)">Draft</span>
<span class="chip" style="background:var(--surface-brand-soft);color:var(--text-brand)">Recurring</span></div></body></html>
