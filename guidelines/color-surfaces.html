<!-- @dsCard group="Colors" viewport="700x150" name="Surfaces" subtitle="Page, card, sunken and brand surfaces with their hairline borders." -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:var(--surface-card);padding:20px;font-family:var(--font-sans)}.sw{display:flex;gap:0}.sw div{flex:1;height:56px;display:flex;align-items:flex-end;padding:6px;font-family:var(--font-mono);font-size:10px}.lbl{font-family:var(--font-ui);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-faint);margin-bottom:8px}.row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.box{height:74px;border-radius:var(--radius-md);border:1px solid var(--border-hairline);display:flex;align-items:flex-end;padding:8px;font-family:var(--font-mono);font-size:10px}</style></head><body><div class="lbl">surface</div><div class="row">
<div class="box" style="background:var(--surface-page)">page</div>
<div class="box" style="background:var(--surface-card);box-shadow:var(--shadow-md)">card</div>
<div class="box" style="background:var(--surface-sunken)">sunken</div>
<div class="box" style="background:var(--surface-inverse);color:var(--text-on-dark)">inverse</div></div></body></html>
