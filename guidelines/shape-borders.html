<!-- @dsCard group="Spacing" viewport="700x140" name="Borders" subtitle="1px hairline, 1.5px default on controls, 3px heavy for accents." -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:var(--surface-card);padding:20px;font-family:var(--font-sans)}.sw{display:flex;gap:0}.sw div{flex:1;height:56px;display:flex;align-items:flex-end;padding:6px;font-family:var(--font-mono);font-size:10px}.lbl{font-family:var(--font-ui);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-faint);margin-bottom:8px}.bd{display:flex;gap:16px}.bd div{flex:1;height:70px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:10px;color:var(--text-muted);background:var(--surface-card)}</style></head><body><div class="lbl">border</div><div class="bd">
<div style="border:1px solid var(--border-hairline)">1px hairline</div>
<div style="border:1.5px solid var(--border-default)">1.5px default</div>
<div style="border:1.5px solid var(--border-brand)">1.5px brand</div>
<div style="border-top:3px solid var(--surface-accent);border-left:1px solid var(--border-hairline);border-right:1px solid var(--border-hairline);border-bottom:1px solid var(--border-hairline)">3px clay top</div></div></body></html>
