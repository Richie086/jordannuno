<!-- @dsCard group="Brand" viewport="700x150" name="Interaction states" subtitle="Hover darkens one step; press nudges 1px down. No scaling, no glow." -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:var(--surface-card);padding:20px;font-family:var(--font-sans)}.sw{display:flex;gap:0}.sw div{flex:1;height:56px;display:flex;align-items:flex-end;padding:6px;font-family:var(--font-mono);font-size:10px}.lbl{font-family:var(--font-ui);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-faint);margin-bottom:8px}.st{display:flex;gap:14px}.st div{padding:12px 20px;border-radius:var(--radius-sm);font-family:var(--font-ui);font-size:14px;font-weight:600;color:var(--action-primary-fg)}</style></head><body><div class="lbl">button · green 700 → 800 → 900</div><div class="st">
<div style="background:var(--green-700)">Rest</div>
<div style="background:var(--green-800)">Hover</div>
<div style="background:var(--green-900);transform:translateY(1px)">Press</div>
<div style="background:var(--green-700);opacity:.45">Disabled</div>
<div style="background:var(--green-700);box-shadow:var(--shadow-focus)">Focus</div></div></body></html>
